name: k_router
description: >-
  Navigator 2.0 router with full state restoration
  and parallel navigation support.
version: 0.1.0+0
homepage: https://github.com/Zekfad/k_router
repository: https://github.com/Zekfad/k_router
issue_tracker: https://github.com/Zekfad/k_router/issues
# documentation: https://pub.dev/documentation/k_router/latest/
topics:
  - navigation
  - deep-linking
  - nested-navigation

platforms:
  android:
  ios:
  windows:
  macos:
  linux:
  web:

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.19.0
  cupertino_ui: ^1.0.0
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  zekfad_lints: ^2.3.1
